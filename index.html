<!DOCTYPE html>
<html lang="en" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nucleus - Financial Dashboard</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap');
        body { font-family: 'Plus Jakarta Sans', sans-serif; }
    </style>
</head>
<body class="bg-zinc-950 text-zinc-100 min-h-screen flex flex-col justify-between selection:bg-emerald-500 selection:text-zinc-950">

    <!-- Top Navigation Header -->
    <header class="sticky top-0 z-40 bg-zinc-900/80 backdrop-blur-md border-b border-zinc-800 px-4 py-3">
        <div class="max-w-7xl mx-auto flex items-center justify-between">
            <!-- Logo Section -->
            <div class="flex items-center space-x-3">
                <div class="w-10 h-10 rounded-xl bg-emerald-500 flex items-center justify-center font-bold text-zinc-950 text-xl shadow-lg shadow-emerald-500/20">
                    N
                </div>
                <span class="text-lg font-bold tracking-wider text-emerald-400">NUCLEUS</span>
            </div>

            <!-- Action Icons -->
            <div class="flex items-center space-x-2 relative">
                <!-- Notification Toggle Button -->
                <button id="notif-btn" class="w-10 h-10 rounded-xl bg-zinc-800/60 border border-zinc-700/50 flex items-center justify-center text-zinc-300 hover:text-emerald-400 hover:border-emerald-500/50 transition-all relative">
                    <i class="fa-regular fa-bell"></i>
                    <span class="absolute top-2 right-2 w-2 h-2 rounded-full bg-emerald-500 animate-pulse"></span>
                </button>

                <button class="w-10 h-10 rounded-xl bg-zinc-800/60 border border-zinc-700/50 flex items-center justify-center text-zinc-300 hover:text-emerald-400 transition-all">
                    <i class="fa-solid fa-gear"></i>
                </button>
                <button class="w-10 h-10 rounded-xl bg-rose-500/10 border border-rose-500/20 flex items-center justify-center text-rose-400 hover:bg-rose-500/20 transition-all">
                    <i class="fa-solid fa-right-from-bracket"></i>
                </button>

                <!-- FIXED NOTIFICATION DROPDOWN / OVERLAY -->
                <div id="notif-dropdown" class="hidden absolute top-14 right-0 w-[calc(100vw-2rem)] sm:w-80 bg-zinc-900 border border-zinc-800 rounded-2xl shadow-2xl p-4 z-50">
                    <div class="flex items-center justify-between pb-3 border-b border-zinc-800">
                        <span class="font-semibold text-sm text-zinc-200">Notifications</span>
                        <button id="clear-all-btn" class="text-xs text-emerald-400 hover:underline">Clear All</button>
                    </div>
                    <div class="mt-3 space-y-2 max-h-60 overflow-y-auto">
                        <div class="p-3 bg-zinc-800/50 border border-zinc-700/40 rounded-xl text-xs space-y-1">
                            <div class="flex justify-between text-zinc-400">
                                <span class="text-rose-400 font-medium">Budget Exceeded (100%+)</span>
                                <span>01:06</span>
                            </div>
                            <p class="text-zinc-300">Food has reached 140% of its allocated limit.</p>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </header>

    <!-- Main Dashboard Workspace -->
    <main class="max-w-7xl mx-auto px-4 py-6 w-full space-y-6 flex-grow">
        
        <!-- Sub-header / Quick Status Row -->
        <div class="flex flex-col sm:flex-row sm:items-center sm:justify-between gap-4 bg-zinc-900/40 border border-zinc-800/80 p-5 rounded-2xl">
            <div>
                <p class="text-xs text-zinc-400 font-medium tracking-wide uppercase">Overview</p>
                <h1 class="text-xl font-bold text-zinc-100 mt-1">Sunday, September 27, 2026</h1>
            </div>
            <button class="bg-emerald-500 hover:bg-emerald-400 text-zinc-950 font-semibold px-4 py-2.5 rounded-xl transition-all shadow-lg shadow-emerald-500/10 flex items-center justify-center space-x-2 text-sm">
                <i class="fa-solid fa-rotate"></i>
                <span>Check Recurring Bills</span>
            </button>
        </div>

        <!-- Metric Cards Grid -->
        <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
            
            <!-- Net Balance Card -->
            <div class="bg-zinc-900/60 border border-zinc-800 p-6 rounded-2xl relative overflow-hidden">
                <p class="text-xs font-semibold tracking-wider text-zinc-400 uppercase">Net Balance</p>
                <h2 class="text-3xl font-extrabold text-emerald-400 mt-2">₹1724.01</h2>
                <p class="text-xs text-zinc-500 mt-1">Total Income minus Expenses</p>
            </div>

            <!-- Total Income Card -->
            <div class="bg-zinc-900/60 border border-zinc-800 p-6 rounded-2xl relative overflow-hidden">
                <p class="text-xs font-semibold tracking-wider text-zinc-400 uppercase">Total Income</p>
                <h2 class="text-3xl font-extrabold text-emerald-400 mt-2">₹4500.00</h2>
                <p class="text-xs text-zinc-500 mt-1">Recorded inflows this month</p>
            </div>

        </div>

    </main>

    <!-- Footer -->
    <footer class="border-t border-zinc-900 py-4 text-center text-xs text-zinc-600">
        Nucleus App &copy; 2026
    </footer>

    <!-- Simple Script to Toggle Notification Box safely on Mobile -->
    <script>
        const notifBtn = document.getElementById('notif-btn');
        const notifDropdown = document.getElementById('notif-dropdown');
        const clearAllBtn = document.getElementById('clear-all-btn');

        notifBtn.addEventListener('click', (e) => {
            e.stopPropagation();
            notifDropdown.classList.toggle('hidden');
        });

        document.addEventListener('click', (e) => {
            if (!notifDropdown.contains(e.target) && !notifBtn.contains(e.target)) {
                notifDropdown.classList.add('hidden');
            }
        });

        clearAllBtn.addEventListener('click', () => {
            const container = notifDropdown.querySelector('.space-y-2');
            container.innerHTML = '<p class="text-center text-zinc-500 py-2">No new notifications</p>';
        });
    </script>
</body>
</html>
